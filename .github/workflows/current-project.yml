```yaml
name: Update current project

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: current-project
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update and push safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/update_current_project.py
            git add -- README.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Update current project [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          echo 'Push failed after 3 attempts; no force-push was used.' >&2
          exit 1

```
